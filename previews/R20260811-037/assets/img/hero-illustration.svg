<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="heroArtTitle">
  <title id="heroArtTitle">Illustration of a tidy home exterior with sparkle accents (demo artwork, not a photo)</title>
  <rect width="600" height="480" fill="#eef6f6"/>
  <rect x="0" y="320" width="600" height="160" fill="#dff0ef"/>
  <!-- house -->
  <rect x="150" y="230" width="260" height="150" rx="6" fill="#ffffff" stroke="#0e7c86" stroke-width="4"/>
  <polygon points="140,235 280,140 420,235" fill="#0a5b63"/>
  <rect x="260" y="300" width="40" height="80" fill="#0e7c86"/>
  <rect x="180" y="260" width="50" height="45" fill="#cdeef0" stroke="#0a5b63" stroke-width="3"/>
  <rect x="330" y="260" width="50" height="45" fill="#cdeef0" stroke="#0a5b63" stroke-width="3"/>
  <!-- sparkles -->
  <g fill="#c96a12">
    <path d="M460 150 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
    <path d="M120 190 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M470 260 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#0e7c86" stroke-width="3" opacity="0.6">
    <circle cx="90" cy="330" r="14"/>
    <circle cx="130" cy="360" r="9"/>
    <circle cx="500" cy="340" r="16"/>
    <circle cx="470" cy="380" r="10"/>
  </g>
</svg>
